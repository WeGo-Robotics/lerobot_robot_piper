# Tag push (v*) -> build sdist + wheel -> GitHub Release + PyPI.
#
# PyPI upload uses Trusted Publishing (OIDC, no token secret). One-time setup
# on pypi.org -> "Publishing" -> add publisher:
#   project: lerobot_robot_wego_piper, owner: WeGo-Robotics,
#   repo: lerobot_robot_piper, workflow: release.yml, environment: (blank)
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      # Structural check only - importing the package would pull in lerobot/torch.
      - name: Sanity-check wheel contents
        run: |
          python - <<'EOF'
          import glob, zipfile
          whl = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(whl).namelist()
          for mod in [
              "lerobot_robot_piper/__init__.py",
              "lerobot_robot_piper/doctor.py",
              "lerobot_robot_piper/motors/__init__.py",
              "lerobot_robot_piper/motors/port_handler.py",
              "lerobot_robot_wego_piper/__init__.py",
          ]:
              assert mod in names, f"missing from wheel: {mod}"
          print("wheel OK:", whl)
          EOF

      - name: Create GitHub Release with artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
